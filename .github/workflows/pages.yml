name: Publier le frontend sur GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Tester et construire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npm run typecheck --workspace frontend
      - name: Exécuter les tests
        run: npm test --workspace frontend
      - name: Construire le site
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api-madrazo.code-eternal.fr' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build --workspace frontend
      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Déployer
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

